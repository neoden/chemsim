<!doctype html><meta charset="utf-8"><title>render check</title>
<style>body{margin:0;background:#222;color:#ccc;font:12px monospace}iframe{border:0;display:block}</style>
<iframe id="app" width="1400" height="900"></iframe>
<script type="module">
const report = (name, body) => fetch('/__report/' + name, { method: 'POST', body });
const log = (s) => report('log.txt', s);
const only = new URLSearchParams(location.search).get('only');
const loaded = (frame) => new Promise((r) => frame.addEventListener('load', r, { once: true }));
const toImageData = async (dataUrl) => {
  const img = new Image(); img.src = dataUrl; await img.decode();
  const c = new OffscreenCanvas(img.width, img.height), ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0);
  return ctx.getImageData(0, 0, img.width, img.height);
};
async function openApp(query) {
  const frame = document.getElementById('app');
  const done = loaded(frame);
  frame.src = '/app/index.html?' + query;
  await done;
  const w = frame.contentWindow;
  while (!w.chemsim) await new Promise((r) => setTimeout(r, 20));
  await w.chemsim.ready;
  return w;
}
const out = { ok: true, orbital: [], grid: [], xtb: [], speed: [] };
const difference = (a, b) => {
  let max = 0, sum = 0, over = 0;
  for (let i = 0; i < a.data.length; i++) {
    const d = Math.abs(a.data[i] - b.data[i]);
    if (d > max) max = d; sum += d; if (d > 8) over++;
  }
  return { maxDiff: max, meanDiff: +(sum / a.data.length).toFixed(4), channelsOver8: over };
};
try {
  // ---- D. the frame drawn from the orbital grid against the exact frame: one scene, both ways
  if (!only || only === 'orbital') {
  for (const [mol, orb, more] of [['h2o', 'homo'], ['h2o', '0'], ['bh3nh3', 'homo'], ['c2h4', 'lumo'], ['c6h6', 'homo'], ['b2h6', 'lumo'], ['sf6', 'homo'], ['ticl4', 'lumo'], ['feco5', 'homo'], ['ferrocene', 'homo'],
    ['c6h6', 'homo', '&plane=view&pmode=knife'], ['bh3', 'lumo', '&second=nh3'], ['pair', 'homo']]) {
    const w = await openApp(`mol=${mol}&orb=${orb}&wobble=0&canvas=900x700${more ?? ''}`);
    const urls = [w.chemsim.snapshot(false), w.chemsim.snapshot(true)], name = `orbital-${mol}-${orb}${more ? '-' + more.replace(/[^a-z0-9]+/g, '') : ''}`;
    await report(`${name}-grid.png`, urls[0]);
    await report(`${name}-exact.png`, urls[1]);
    const row = { mol, orb, more, fromGrid: w.chemsim.renderer.orbGrid, gridSize: w.chemsim.renderer.orb.n, ...difference(await toImageData(urls[0]), await toImageData(urls[1])) };
    out.orbital.push(row);
    await log('orbital ' + JSON.stringify(row));
  }
  }
  // ---- E. which frames are exact: the grid while the picture changes, one exact frame once it stands still
  if (!only || only === 'still') {
    const w = await openApp('mol=h2o&wobble=0&canvas=900x700');
    const r = w.chemsim.renderer, draw = r.draw.bind(r), calls = [];
    r.draw = (camera, options) => { calls.push(options.exact ? 'exact' : 'grid'); draw(camera, options); };
    const wait = (ms) => new Promise((done) => setTimeout(done, ms));
    await wait(600); // the first frames are over
    calls.length = 0;
    w.chemsim.selectOrbital(0);
    await wait(100);
    const early = calls.join(' ');
    await wait(600);
    const late = calls.join(' ');
    await wait(400);
    out.still = { early, late, after: calls.join(' '), ok: early === 'grid' && late === 'grid exact' && calls.length === 2 };
    if (!out.still.ok) out.ok = false;
    await log('still ' + JSON.stringify(out.still));
  }
  // ---- C. body density from the 3D grid against the exact evaluation
  if (!only || only === 'grid') {
  for (const [mol, orb] of [['h2o', 'homo'], ['bh3nh3', 'homo'], ['c2h4', 'lumo'], ['c6h6', 'homo'], ['b2h6', 'lumo'], ['sf6', 'homo'], ['ticl4', 'lumo'], ['feco5', 'homo']]) {
    const shots = [];
    for (const g of [1, 0]) {
      const w = await openApp(`mol=${mol}&orb=${orb}&wobble=0&bodygrid=${g}&canvas=900x700`);
      const url = w.chemsim.snapshot();
      shots.push(await toImageData(url));
      await report(`grid-${mol}-${orb}-${g ? 'grid' : 'exact'}.png`, url);
    }
    let max = 0, sum = 0, over = 0;
    for (let i = 0; i < shots[0].data.length; i++) {
      const d = Math.abs(shots[0].data[i] - shots[1].data[i]);
      if (d > max) max = d; sum += d; if (d > 8) over++;
    }
    const row = { mol, orb, maxDiff: max, meanDiff: +(sum / shots[0].data.length).toFixed(4), channelsOver8: over };
    out.grid.push(row);
    await log('grid ' + JSON.stringify(row));
  }
  }
  // ---- B. xTB pictures for looking at, and frame times
  if (!only || only === 'xtb') {
  for (const [mol, orb] of [['h2o', 'homo'], ['bh3', 'lumo'], ['c2h4', 'homo'], ['c2h4', 'lumo'], ['bh3nh3', 'homo'], ['c6h6', 'homo'], ['b2h6', 'homo'], ['h2s', 'lumo'], ['sf6', 'homo'], ['ticl4', 'lumo'], ['nico4', 'homo'], ['feco5', 'homo'], ['crco6', 'homo'], ['ferrocene', 'homo']]) {
    const w = await openApp(`mol=${mol}&orb=${orb}&wobble=0`);
    await report(`xtb-${mol}-${orb}.png`, w.chemsim.snapshot());
    out.xtb.push({ mol, orb, eV: +(w.chemsim.state.result.eps[w.chemsim.state.selected] * 27.211386).toFixed(3) });
    if (orb === 'homo') {
      const b = w.chemsim.benchmark(10);
      out.speed.push({ mol, atoms: w.chemsim.state.molecule.elements.length, ...b, ms: +b.ms.toFixed(1), gridMs: +b.gridMs.toFixed(1) });
      await log('speed ' + JSON.stringify(out.speed.at(-1)));
    }
  }
  }
} catch (e) {
  out.ok = false; out.error = String(e.stack || e);
}
await report('done.json', JSON.stringify(out, null, 1));
</script>

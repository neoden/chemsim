# Publishes app/ to GitHub Pages on every push to master.
# app/ is the finished site: the module, licences and sources are committed.
# After a rebuild of the module, run tools/build-site.mjs and commit app/licenses/ and app/source/.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Two jobs on purpose. With the upload and the deployment in one job, deploy-pages asked for
# the artifact less than a second after it was uploaded and at times was told there was none
# ("Found 0 artifact(s)"); a job of its own starts late enough for the artifact to be listed.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

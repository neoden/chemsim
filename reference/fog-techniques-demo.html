<!doctype html><html><head><meta charset="utf-8"><style>
:root{--text-primary:#141413;--text-secondary:#5f5e5a;--text-danger:#a32d2d;--border:#ddd;--font-sans:system-ui,sans-serif;--radius:8px}
body{margin:0;padding:16px;width:680px;font-family:var(--font-sans);background:#faf9f5}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style></head><body>
<style>
.fg-row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin:12px 0 0}
.fg-row label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-primary);cursor:pointer}
.fg-leg{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;font-size:13px;color:var(--text-secondary)}
.fg-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
</style>
<h2 class="sr-only">Интерактивное демо: два перекрывающихся электронных облака с переключателями приёмов объёмного рендеринга</h2>
<canvas id="fg-cv" style="display:block;width:100%;height:400px;border-radius:12px;background:#090a0f;touch-action:none;cursor:grab"></canvas>
<p id="fg-err" style="display:none;font-size:13px;color:var(--text-danger);margin:8px 0 0"></p>
<div class="fg-row">
<label><input type="checkbox" id="fg-abs" checked>Поглощение</label>
<label><input type="checkbox" id="fg-shell" checked>Мягкая оболочка</label>
<label><input type="checkbox" id="fg-lit" checked>Свет по градиенту</label>
<label><input type="checkbox" id="fg-ov" checked>Перекрытие третьим цветом</label>
<label><input type="checkbox" id="fg-wob" checked>Покачивание камеры</label>
<label><input type="checkbox" id="fg-flip">Фаза B перевёрнута</label>
</div>
<div class="fg-row">
<label for="fg-d" style="color:var(--text-secondary)">Расстояние</label>
<input type="range" id="fg-d" min="1.6" max="6" step="0.05" value="3.3" style="flex:1;min-width:160px">
<span id="fg-dv" style="font-size:14px;font-weight:500;min-width:32px">3.3</span>
<button id="fg-mush">Каша</button>
<button id="fg-all">Всё включено</button>
</div>
<div class="fg-leg">
<span><i style="background:#3885ff"></i>облако A</span>
<span><i style="background:#ff801f"></i>облако B</span>
<span><i style="background:#59ff99"></i>перекрытие в фазе</span>
<span><i style="background:#ff33a6"></i>перекрытие в противофазе</span>
</div>
<script>
(function(){
const cv=document.getElementById('fg-cv');
const err=document.getElementById('fg-err');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false});
if(!gl){err.textContent='WebGL2 недоступен в этом браузере.';err.style.display='block';return;}
const vs=`#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;
const fs=`#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uR;
uniform vec3 uCam;
uniform float uD,uAbs,uShell,uLit,uOv,uFlip;
const float A=0.45;
const vec3 CA=vec3(0.22,0.52,1.0);
const vec3 CB=vec3(1.0,0.5,0.12);
const vec3 CP=vec3(0.35,1.0,0.6);
const vec3 CN=vec3(1.0,0.2,0.65);
float ign(vec2 p){return fract(52.9829189*fract(dot(p,vec2(0.06711056,0.00583715))));}
void fields(vec3 p,out float pa,out vec3 ga,out float pb,out vec3 gb){
vec3 ra=p-vec3(-0.5*uD,0.0,0.0);
float ea=exp(-A*dot(ra,ra));
float fa=0.6+0.8*ra.x;
pa=fa*ea;
ga=ea*(vec3(0.8,0.0,0.0)-2.0*A*fa*ra);
vec3 rb=p-vec3(0.5*uD,0.0,0.0);
float eb=exp(-A*dot(rb,rb));
float s=uFlip>0.5?1.4:-1.4;
pb=s*rb.x*eb;
gb=s*eb*(vec3(1.0,0.0,0.0)-2.0*A*rb.x*rb);
}
float band(float rho,float lvl,float w){float x=(log(rho+1e-7)-log(lvl))/w;return exp(-x*x);}
float sig(float rho){
if(uShell>0.5)return 3.4*band(rho,0.22,0.28)+1.0*band(rho,0.02,0.3)+0.04*rho;
return 1.3*rho;
}
vec3 shade(vec3 c,vec3 g,vec3 rd,vec3 L){
if(uLit<0.5)return c;
vec3 n=-normalize(g+vec3(1e-7));
float d=max(dot(n,L),0.0);
float rim=pow(1.0-abs(dot(n,rd)),2.5);
return c*(0.28+0.85*d)+0.3*rim*c;
}
void main(){
vec2 uv=(gl_FragCoord.xy*2.0-uR)/uR.y;
float cy=cos(uCam.x),sy=sin(uCam.x),cp=cos(uCam.y),sp=sin(uCam.y);
vec3 ro=uCam.z*vec3(sy*cp,sp,cy*cp);
vec3 fw=normalize(-ro);
vec3 rt=normalize(cross(fw,vec3(0.0,1.0,0.0)));
vec3 up=cross(rt,fw);
vec3 rd=normalize(fw*2.3+rt*uv.x+up*uv.y);
vec3 L=normalize(rt*0.55+up*0.75-fw*0.45);
vec3 bg=vec3(0.006,0.007,0.012);
float R=5.6;
float b=dot(ro,rd);
float h=b*b-(dot(ro,ro)-R*R);
vec3 col=vec3(0.0);
float T=1.0;
vec3 nA=vec3(-0.5*uD,0.0,0.0)-ro;
vec3 nB=vec3(0.5*uD,0.0,0.0)-ro;
float tA=dot(nA,rd),tB=dot(nB,rd);
float TA=1.0,TB=1.0;
if(h>0.0){
h=sqrt(h);
float t0=max(-b-h,0.0),t1=-b+h;
const int N=110;
float dt=(t1-t0)/float(N);
float t=t0+dt*ign(gl_FragCoord.xy);
for(int i=0;i<N;i++){
vec3 p=ro+rd*t;
float pa,pb;vec3 ga,gb;
fields(p,pa,ga,pb,gb);
float sa=sig(pa*pa),sb=sig(pb*pb);
vec3 ca=shade(CA,pa*ga,rd,L),cb=shade(CB,pb*gb,rd,L);
float so=0.0;vec3 co=vec3(0.0);
if(uOv>0.5){
float ov=pa*pb;
float m=smoothstep(0.03,0.28,abs(ov));
so=4.5*m;
co=shade(ov>0.0?CP:CN,sign(ov)*(pa*gb+pb*ga),rd,L);
sa*=1.0-0.8*m;sb*=1.0-0.8*m;
}
float s=sa+sb+so;
vec3 e=sa*ca+sb*cb+so*co;
if(uAbs>0.5){
float a=1.0-exp(-s*dt);
col+=T*a*e/max(s,1e-5);
T*=1.0-a;
}else{
col+=e*dt*0.55;
}
t+=dt;
if(t<tA)TA=T;
if(t<tB)TB=T;
if(T<0.01)break;
}
}
if(uAbs>0.5)col+=T*bg;else col=1.0-exp(-col*1.3)+bg;
float gA=exp(-(dot(nA,nA)-tA*tA)/0.006);
float gB=exp(-(dot(nB,nB)-tB*tB)/0.006);
col+=vec3(1.0)*(gA*(0.25+0.75*TA)+gB*(0.25+0.75*TB));
o=vec4(pow(clamp(col,0.0,1.0),vec3(1.0/2.2)),1.0);
}`;
function sh(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){throw new Error(gl.getShaderInfoLog(s));}return s;}
let pr;
try{pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(pr));}
catch(e){err.textContent='Шейдер не собрался: '+e.message;err.style.display='block';console.log('[fog] '+e.message);return;}
gl.useProgram(pr);
const U={};['uR','uCam','uD','uAbs','uShell','uLit','uOv','uFlip'].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
const el=id=>document.getElementById(id);
const ids=['fg-abs','fg-shell','fg-lit','fg-ov','fg-wob','fg-flip'];
const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduce)el('fg-wob').checked=false;
let yaw=0.55,pitch=0.28,dirty=true,drag=null;
function size(){const s=Math.min(window.devicePixelRatio||1,1.5);const w=Math.max(1,Math.round(cv.clientWidth*s)),h=Math.max(1,Math.round(cv.clientHeight*s));if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;dirty=true;}}
function frame(ts){
size();
const wob=el('fg-wob').checked&&!drag;
if(dirty||wob){
const y=yaw+(wob?0.2*Math.sin(ts*0.0009):0);
gl.viewport(0,0,cv.width,cv.height);
gl.uniform2f(U.uR,cv.width,cv.height);
gl.uniform3f(U.uCam,y,pitch,9.5);
gl.uniform1f(U.uD,parseFloat(el('fg-d').value));
gl.uniform1f(U.uAbs,el('fg-abs').checked?1:0);
gl.uniform1f(U.uShell,el('fg-shell').checked?1:0);
gl.uniform1f(U.uLit,el('fg-lit').checked?1:0);
gl.uniform1f(U.uOv,el('fg-ov').checked?1:0);
gl.uniform1f(U.uFlip,el('fg-flip').checked?1:0);
gl.drawArrays(gl.TRIANGLES,0,3);
dirty=false;
}
requestAnimationFrame(frame);
}
ids.forEach(id=>el(id).addEventListener('change',()=>{dirty=true;}));
el('fg-d').addEventListener('input',e=>{el('fg-dv').textContent=parseFloat(e.target.value).toFixed(1);dirty=true;});
function preset(on){['fg-abs','fg-shell','fg-lit','fg-ov'].forEach(id=>el(id).checked=on);if(!reduce)el('fg-wob').checked=on;dirty=true;}
el('fg-mush').addEventListener('click',()=>preset(false));
el('fg-all').addEventListener('click',()=>preset(true));
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';});
cv.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag.x)*0.008;pitch=Math.max(-1.4,Math.min(1.4,pitch+(e.clientY-drag.y)*0.008));drag={x:e.clientX,y:e.clientY};dirty=true;});
const end=()=>{drag=null;cv.style.cursor='grab';};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
requestAnimationFrame(frame);
})();
</script>
</body></html>
